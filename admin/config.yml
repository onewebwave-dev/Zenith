backend:
  name: github
  repo: onewebwave-dev/Zenith
  branch: main

media_folder: "assets"
public_folder: "/assets"

collections:
  - name: "settings"
    label: "Настройки сайта"
    files:
      - name: "prices"
        label: "Цены калькулятора"
        file: "data/prices.json"
        fields:
          - {label: "Базовая цена (BASE)", name: "base_price", widget: "number", default: 2990}
          - {label: "Цена за 2-ю страницу", name: "page_2", widget: "number", default: 800}
          - {label: "Цена за 3-ю страницу", name: "page_3", widget: "number", default: 1000}
          - label: "Блоки"
            name: "blocks"
            widget: "list"
            fields:
              - {label: "Название", name: "label", widget: "string"}
              - {label: "Цена", name: "price", widget: "number"}
          - label: "Фишки"
            name: "features"
            widget: "list"
            fields:
              - {label: "Название", name: "label", widget: "string"}
              - {label: "Цена", name: "price", widget: "number"}

      - name: "concepts"
        label: "Портфолио-концепции"
        file: "data/concepts.json"
        fields:
          - label: "BASE"
            name: "base"
            widget: "object"
            fields:
              - {label: "Название", name: "title", widget: "string"}
              - {label: "Описание", name: "description", widget: "text"}
              - {label: "Ссылка", name: "link", widget: "string"}
              - {label: "Цена", name: "price", widget: "string"}

          - label: "PREMIUM"
            name: "premium"
            widget: "object"
            fields:
              - {label: "Название", name: "title", widget: "string"}
              - {label: "Описание", name: "description", widget: "text"}
              - {label: "Ссылка", name: "link", widget: "string"}
              - {label: "Цена", name: "price", widget: "string"}

          - label: "ELITE"
            name: "elite"
            widget: "object"
            fields:
              - {label: "Название", name: "title", widget: "string"}
              - {label: "Описание", name: "description", widget: "text"}
              - {label: "Ссылка", name: "link", widget: "string"}
              - {label: "Цена", name: "price", widget: "string"}

  - name: "pages"
    label: "Страницы"
    files:
      - name: "home"
        label: "Главная"
        file: "data/home.json"
        fields:
          - {label: "Заголовок", name: "hero_title", widget: "string"}
          - {label: "Подзаголовок", name: "hero_lead", widget: "text"}
          - {label: "Текст о студии", name: "about_text", widget: "markdown"}
